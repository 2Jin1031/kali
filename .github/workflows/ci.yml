name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 가드 시나리오 테스트
        run: bash .github/scripts/guard-test.sh

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: ./gradlew check
        run: |
          start=$SECONDS
          if ./gradlew check --console=plain; then rc=0; else rc=$?; fi
          elapsed=$((SECONDS - start))
          result=$([ "$rc" -eq 0 ] && echo 통과 || echo "실패(exit $rc)")
          {
            echo "### 걸린 시간"
            echo "| 단계 | 결과 | 초 |"
            echo "|---|---|---|"
            echo "| ./gradlew check | $result | $elapsed |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
