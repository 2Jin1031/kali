name: CI

on:
  pull_request:
    # labeled/unlabeled: `사람-확인` 라벨을 달면 가드를 다시 돌리기 위해
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: ./gradlew check
        run: |
          start=$SECONDS
          ./gradlew check --console=plain
          echo "CHECK_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: 가드 (base 대비 diff)
        # check가 실패해도 가드 결과는 따로 보이게
        if: success() || failure()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          start=$SECONDS
          # PR이 가드 자체를 고쳐서 통과하지 못하게, base 브랜치에 있는 가드를 실행한다
          guard="$RUNNER_TEMP/guard.sh"
          if git show "$BASE_SHA:.github/scripts/guard.sh" > "$guard" 2>/dev/null; then
            echo "base($BASE_SHA)의 가드 사용"
          else
            echo "::warning::base에 가드가 없어 PR의 가드를 사용 (가드를 처음 들이는 PR)"
            cp .github/scripts/guard.sh "$guard"
          fi
          bash "$guard" "$BASE_SHA" "$HEAD_SHA"
          echo "GUARD_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: 걸린 시간
        if: always()
        run: |
          {
            echo "### 걸린 시간"
            echo "| 단계 | 초 |"
            echo "|---|---|"
            echo "| ./gradlew check | ${CHECK_SECONDS:-실패/미실행} |"
            echo "| 가드 | ${GUARD_SECONDS:-실패/미실행} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
